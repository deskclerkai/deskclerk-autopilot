name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, access tokens, customer phone numbers or chat contents.
        For security issues, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 / commit sha
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options:
        - Local (run.sh)
        - Docker
        - Behind a reverse proxy
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data first.
      render: shell
